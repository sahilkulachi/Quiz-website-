<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <div class="quiz-header">
            <h1>Quiz Master</h1>
            <p>Test Your Knowledge</p>
        </div>

        <div class="quiz-box">

            <div class="quiz-info">
                <span id="question-number">Question 1 of 10</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="timer">
                Time: <span id="time">15</span>s
            </div>

            <h2 id="question">Question will appear here</h2>

            <div id="answers" class="answers">
                <button class="answer">Answer 1</button>
                <button class="answer">Answer 2</button>
                <button class="answer">Answer 3</button>
                <button class="answer">Answer 4</button>
            </div>

            <button id="next-btn">Next Question</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
  </html>
